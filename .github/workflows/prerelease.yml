name: Pre-release

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'

concurrency:
  group: "pre-release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      id: keystore
      run: |
        KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
        echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "${KEYSTORE_PATH}"
        echo "path=${KEYSTORE_PATH}" >> $GITHUB_OUTPUT

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Run Gradle
      run: ./gradlew assembleAlphaRelease androidSourcesJar makeJar
      env:
        SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        MAL_KEY: ${{ secrets.MAL_KEY }}
        ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

    - name: Delete keystore
      if: always()
      run: rm -f "${RUNNER_TEMP}/release.jks"

    # softprops/action-gh-release does not move an existing tag, so the
    # pre-release tag would stay frozen at the commit where it was first
    # created. The in-app updater compares the installed build's commit
    # against this tag, so a stale tag makes every newer build show a
    # perpetual "update available". Force the tag onto the built commit.
    - name: Move pre-release tag to built commit
      run: |
        git tag -f pre-release
        git push -f origin refs/tags/pre-release

    - name: Create pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: pre-release
        prerelease: true
        make_latest: false
        name: "Pre-release Build"
        files: |
          app/build/outputs/apk/alpha/release/*.apk
          app/build/libs/app-sources.jar
          app/build/classes.jar
